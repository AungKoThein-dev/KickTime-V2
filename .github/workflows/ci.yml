name: KickTime CI

on:
  push:
    branches:
      - main
      - feature/sprint-2

  pull_request:
    branches:
      - main

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build API
        run: dotnet build src/KickTime.API/KickTime.API.csproj --no-restore --configuration Release

      - name: Test Integration Tests
        run: dotnet test tests/KickTime.API.IntegrationTests/KickTime.API.IntegrationTests.csproj --configuration Release


  build-database:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Database Project
        run: |
          msbuild src/KickTime.Database/KickTime.Database.sqlproj `
            /p:Configuration=Release `
            /p:Platform="Any CPU"