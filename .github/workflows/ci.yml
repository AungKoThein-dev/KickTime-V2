name: KickTime CI

on:
  push:
    branches:
      - main
      - feature/sprint-2

  pull_request:
    branches:
      - main

jobs:

  # ============================================
  # 1. BUILD API
  # ============================================
  build-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/KickTime.API/KickTime.API.csproj

      - name: Build API
        run: >
          dotnet build
          src/KickTime.API/KickTime.API.csproj
          --no-restore
          --configuration Release


  # ============================================
  # 2. BUILD DATABASE
  # ============================================
  build-database:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Database Project
        shell: pwsh
        run: |
          msbuild src/KickTime.Database/KickTime.Database.sqlproj `
            /p:Configuration=Release `
            /p:Platform="Any CPU"

      - name: Find DACPAC
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.dacpac

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: kicktime-database
          path: "**/*.dacpac"
          if-no-files-found: error


  # ============================================
  # 3. INTEGRATION TESTS
  # ============================================
  integration-tests:
  needs:
    - build-and-unit-test
    - build-database

  runs-on: ubuntu-latest

  env:
    ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=KickTime;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

  steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Start SQL Server
      run: |
        docker run -d \
          --name kicktime-sqlserver \
          -e "ACCEPT_EULA=Y" \
          -e "MSSQL_SA_PASSWORD=YourStrongPassword123!" \
          -p 1433:1433 \
          mcr.microsoft.com/mssql/server:2022-latest

    - name: Wait for SQL Server
      run: |
        for i in {1..30}; do
          if docker exec kicktime-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "YourStrongPassword123!" \
            -C \
            -Q "SELECT 1"
          then
            echo "SQL Server is ready!"
            exit 0
          fi

          echo "Waiting for SQL Server..."
          sleep 2
        done

        echo "SQL Server failed to start."
        exit 1

    - name: Download DACPAC
      uses: actions/download-artifact@v4
      with:
        name: kicktime-database
        path: ./database-artifact

    - name: Show downloaded DACPAC
      run: |
        ls -R ./database-artifact

    - name: Install SqlPackage
      run: |
        wget -q https://aka.ms/sqlpackage-linux -O sqlpackage.zip
        unzip -q sqlpackage.zip -d $HOME/sqlpackage
        chmod +x $HOME/sqlpackage/sqlpackage
        echo "$HOME/sqlpackage" >> $GITHUB_PATH

    - name: Verify SqlPackage
      run: sqlpackage /Version

    - name: Deploy DACPAC
      run: |
        sqlpackage \
          /Action:Publish \
          /SourceFile:"./database-artifact/KickTime.Database.dacpac" \
          /TargetConnectionString:"Server=localhost,1433;Database=KickTime;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"

    - name: Run Integration Tests
      run: |
        dotnet test \
          tests/KickTime.API.IntegrationTests/KickTime.API.IntegrationTests.csproj \
          --configuration Release